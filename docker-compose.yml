# Run everything locally:  docker compose up --build
# App: http://localhost:3000   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: truthshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truthshield}
      POSTGRES_DB: truthshield
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truthshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg2://truthshield:${POSTGRES_PASSWORD:-truthshield}@db:5432/truthshield
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000,http://localhost:5173}
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      FACT_CHECK_API_KEY: ${FACT_CHECK_API_KEY:-}
    depends_on: { db: { condition: service_healthy } }
    volumes: [uploads:/srv/uploads]
    ports: ["8000:8000"]

  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    depends_on: [backend]
    ports: ["3000:80"]

volumes:
  pgdata:
  uploads:
